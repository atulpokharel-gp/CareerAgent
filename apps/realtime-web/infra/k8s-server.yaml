apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-ops-realtime-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: career-ops-realtime-server
  template:
    metadata:
      labels:
        app: career-ops-realtime-server
    spec:
      containers:
        - name: server
          image: ghcr.io/your-org/career-ops-realtime-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8787"
            - name: HOST
              value: "0.0.0.0"
            - name: SESSION_TTL_MS
              value: "21600000"
            - name: MAX_SESSIONS
              value: "15000"
            - name: GLOBAL_CONCURRENT_SCANS
              value: "50"
          ports:
            - containerPort: 8787
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: career-ops-realtime-server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: career-ops-realtime-server
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: v1
kind: Service
metadata:
  name: career-ops-realtime-server
spec:
  selector:
    app: career-ops-realtime-server
  ports:
    - port: 80
      targetPort: 8787
